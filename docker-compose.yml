# Local development services only. Production uses Neon (see docs/DEPLOYMENT.md).
services:
  postgres:
    image: postgres:17-alpine
    container_name: encore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore_dev_password
      POSTGRES_DB: encore_local
    ports:
      - "5433:5432"
    volumes:
      - encore-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore -d encore_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  encore-pgdata:
