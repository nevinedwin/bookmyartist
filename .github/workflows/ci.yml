name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore_ci_password
          POSTGRES_DB: encore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U encore -d encore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://encore:encore_ci_password@localhost:5432/encore_test
      DIRECT_DATABASE_URL: postgresql://encore:encore_ci_password@localhost:5432/encore_test
      TEST_DATABASE_URL: postgresql://encore:encore_ci_password@localhost:5432/encore_test
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer seeds the demo catalogue, runs `next build`
      # (which prerenders against the database) and starts the production server.
      - name: Production build + end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
